<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3000" viewBox="0 0 1800 3000" role="img" aria-labelledby="title"><title id="title">攝影新手 LLM Wiki Ingest Graph v2</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617284"/></marker><style>text{font-family:'Microsoft JhengHei',sans-serif;fill:#22354b;text-anchor:middle}.t{font-size:52px;font-weight:bold}.h{font-size:33px;font-weight:bold}.b{font-size:28px}.e{fill:none;stroke:#617284;stroke-width:4;marker-end:url(#a)}.r{stroke:#b36c63}.d{stroke-dasharray:10 8}</style></defs><rect width="1800" height="3000" fill="#f6f3ed"/><text class="t" x="900" y="85">攝影新手 LLM Wiki｜Ingest Graph v2</text><text class="b" x="900" y="145">先辨認對象與條件，再驗證主張；人工審閱後才正式寫入</text><text class="b" x="900" y="205">黃：檢查　綠：產出　紅：回修／暫存　｜　虛線：待補證據</text><rect x="600" y="270" width="720" height="160" rx="22" fill="#fff" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="318">01　確認範圍・讀取一篇 raw</text><text class="b" x="960" y="362">沿用已確認目的，保留來源原檔</text><text class="b" x="960" y="400">SRC／URL／收件日期／未知日期／雜湊</text><path class="e " d="M960 430 V480"/><rect x="600" y="480" width="720" height="160" rx="22" fill="#fff2d3" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="528">02　Source Gate：來源分流</text><text class="b" x="960" y="572">正文清潔・缺圖・互動・器材時效</text><text class="b" x="960" y="610">可用文字通過；限制隨主張往下傳</text><path class="e " d="M960 640 V690"/><rect x="600" y="690" width="720" height="160" rx="22" fill="#fff2d3" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="738">03　語義預檢【前移】</text><text class="b" x="960" y="782">對象 → 變數 → 方向 → 適用條件</text><text class="b" x="960" y="820">光源色溫 ≠ WB 設定；例子 ≠ 規格</text><path class="e " d="M960 850 V900"/><rect x="600" y="900" width="720" height="160" rx="22" fill="#fff2d3" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="948">04　抽取主張 ＋ 逐條驗證</text><text class="b" x="960" y="992">Claim ID／章節／依據／條件／狀態</text><text class="b" x="960" y="1030">檢查忠實性、數值、方向與泛化</text><path class="e " d="M960 1060 V1110"/><rect x="600" y="1110" width="720" height="160" rx="22" fill="#fff2d3" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="1158">05　查詢 Wiki ＋ 跨來源比對</text><text class="b" x="960" y="1202">先讀現有概念、來源與 Claim Ledger</text><text class="b" x="960" y="1240">新舊衝突保留雙方，不靜默覆蓋</text><path class="e " d="M960 1270 V1320"/><rect x="600" y="1320" width="720" height="160" rx="22" fill="#e5f2ea" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="1368">06　產生待審稿【不正式寫入】</text><text class="b" x="960" y="1412">來源摘要・概念頁・主張表・關聯連結</text><text class="b" x="960" y="1450">不確定與缺口明示，不填補成事實</text><path class="e " d="M960 1480 V1530"/><rect x="600" y="1530" width="720" height="160" rx="22" fill="#fff2d3" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="1578">07　Lint：引用・條件・連結</text><text class="b" x="960" y="1622">核對主張覆蓋、術語、重複與孤立頁</text><text class="b" x="960" y="1660">語義回 04；格式回 06；通過往下</text><path class="e " d="M960 1690 V1740"/><rect x="600" y="1740" width="720" height="160" rx="22" fill="#fff2d3" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="1788">08　人工審閱【本輪停止點】</text><text class="b" x="960" y="1832">模型檢查完成 ≠ 人工已確認</text><text class="b" x="960" y="1870">同意往下；意見回 06 再走檢查</text><path class="e " d="M960 1900 V1950"/><rect x="600" y="1950" width="720" height="160" rx="22" fill="#e5f2ea" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="1998">09　正式整合 Wiki ＋ 紀錄</text><text class="b" x="960" y="2042">更新來源／概念／ledger／index／log</text><text class="b" x="960" y="2080">寫後查連結；失敗回 06 修正後再審</text><path class="e " d="M960 2110 V2160"/><rect x="600" y="2160" width="720" height="160" rx="22" fill="#fff2d3" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="2208">10　還有下一篇來源？</text><text class="b" x="960" y="2252">有：回 01，逐篇重複</text><text class="b" x="960" y="2290">沒有：完成批次報告</text><path class="e " d="M960 2320 V2370"/><rect x="600" y="2370" width="720" height="160" rx="22" fill="#e5f2ea" stroke="#91a4b6" stroke-width="3"/><text class="h" x="960" y="2418">11　完成批次・保留執行證據</text><text class="b" x="960" y="2462">彙整回修次數、缺口與實際結果</text><text class="b" x="960" y="2500">經核准的 Wiki 才供後續簡報查詢</text><rect x="1390" y="480" width="370" height="198" rx="22" fill="#fae8e4" stroke="#91a4b6" stroke-width="3"/><text class="h" x="1575" y="528">來源不足</text><text class="b" x="1575" y="572">不可讀／身份不明</text><text class="b" x="1575" y="610">重取後回 02</text><text class="b" x="1575" y="648">無法取得 → 暫存</text><path class="e r" d="M1320 540 H1390"/><rect x="1390" y="735" width="370" height="160" rx="22" fill="#fae8e4" stroke="#91a4b6" stroke-width="3"/><text class="h" x="1575" y="783">缺口清單</text><text class="b" x="1575" y="827">缺圖／缺證／待釐清</text><text class="b" x="1575" y="865">僅受影響主張暫存</text><path class="e d" d="M1575 678 V735"/><rect x="1390" y="960" width="370" height="198" rx="22" fill="#fae8e4" stroke="#91a4b6" stroke-width="3"/><text class="h" x="1575" y="1008">主張回修</text><text class="b" x="1575" y="1052">回原文修正／縮限</text><text class="b" x="1575" y="1090">重新進入 04 驗證</text><text class="b" x="1575" y="1128">仍缺證 → 暫存</text><path class="e r" d="M1320 1000 H1390"/><path class="e r" d="M1575 960 V925 H1320"/><path class="e d" d="M1575 960 V895"/><rect x="60" y="1100" width="420" height="198" rx="22" fill="#fae8e4" stroke="#91a4b6" stroke-width="3"/><text class="h" x="270" y="1148">衝突處理</text><text class="b" x="270" y="1192">核對對象、條件與年代</text><text class="b" x="270" y="1230">保留不相容說法及來源</text><text class="b" x="270" y="1268">無法判定 → 暫存爭議</text><path class="e r" d="M600 1170 H480"/><path class="e r" d="M270 1100 V985 H600"/><rect x="1390" y="1530" width="370" height="160" rx="22" fill="#fae8e4" stroke="#91a4b6" stroke-width="3"/><text class="h" x="1575" y="1578">Lint 回修</text><text class="b" x="1575" y="1622">證據／語意 → 04</text><text class="b" x="1575" y="1660">連結／格式 → 06</text><path class="e r" d="M1320 1600 H1390"/><path class="e r" d="M1575 1530 V1420 H1320"/><path class="e r" d="M1740 1530 V1190 H1350 V1040 H1320"/><rect x="60" y="1740" width="420" height="160" rx="22" fill="#fae8e4" stroke="#91a4b6" stroke-width="3"/><text class="h" x="270" y="1788">人工提出修改</text><text class="b" x="270" y="1832">只重寫受影響內容</text><text class="b" x="270" y="1870">主張變更須重走 04–07</text><path class="e r" d="M600 1810 H480"/><path class="e r" d="M270 1740 V1390 H600"/><path class="e r" d="M600 2240 H530 V350 H600"/><text class="b" x="555" y="2200">有</text><text class="b" x="1000" y="2350">無</text><rect x="60" y="480" width="420" height="198" rx="22" fill="#fff" stroke="#91a4b6" stroke-width="3"/><text class="h" x="270" y="528">三種通行結果</text><text class="b" x="270" y="572">通過：證據足以支持</text><text class="b" x="270" y="610">附限制通過：保留缺口</text><text class="b" x="270" y="648">阻擋：不可用主張不下傳</text><rect x="60" y="735" width="420" height="198" rx="22" fill="#fff" stroke="#91a4b6" stroke-width="3"/><text class="h" x="270" y="783">避免無效重生成</text><text class="b" x="270" y="827">重取後仍缺證就記錄缺口</text><text class="b" x="270" y="865">待新增證據才重開檢查</text><text class="b" x="270" y="903">不以重試次數代替正確性</text><rect x="60" y="1950" width="420" height="160" rx="22" fill="#fff" stroke="#91a4b6" stroke-width="3"/><text class="h" x="270" y="1998">狀態分開記錄</text><text class="b" x="270" y="2042">已驗證／待人工／已整合</text><text class="b" x="270" y="2080">尚未確認不算正式完成</text><rect x="180" y="2630" width="1440" height="220" rx="22" fill="#e5f2ea" stroke="#91a4b6" stroke-width="3"/><text class="h" x="900" y="2678">本次實跑：SRC-06 白平衡｜只跑 ingest，不修改簡報</text><text class="b" x="900" y="2722">12 條候選 → 4 條語義／條件回修 → 12 條附證據待審</text><text class="b" x="900" y="2760">raw 完整保存；原圖未驗證；AWB 範圍不當現代通用規格</text><text class="b" x="900" y="2798">新增檢查的效果尚需下一篇測試，本次不足以估計長期錯誤率</text></svg>
